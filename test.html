<style type="text/css">
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    height: 100%;
}

body {
    background-image: url(assets/background.jpg);
    background-repeat: repeat;
    background-attachment: fixed;
    font-family: 'IBMPlex', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

@font-face {
    font-family: 'IBMPlex';
    src: url('fonts/IBM.ttf') format('truetype');
}

.quiz-container {
    background-color: rgba(255, 255, 255, 0.92);
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    width: 100%;
    height: 100%;
    padding: 30px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-y: auto;
}

.header-section {
    text-align: left;
    margin-bottom: 20px;
}

.title {
    font-family: 'IBMPlex', sans-serif;
    color: #2c3e50;
    font-size: 28px;
    margin-bottom: 12px;
}

.btn-capsule {
    display: inline-block;
    padding: 8px 20px;
    background-color: #ffffff;
    color: #6dafe1;
    border: 2px solid #6dafe1;
    border-radius: 50px;
    font-family: 'IBMPlex', sans-serif;
    font-size: 15px;
    font-weight: bold;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
}

.btn-capsule:hover {
    background-color: #6dafe1;
    color: #ffffff;
}

/* Quiz Section */
.content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}

.quiz-card {
    width: 100%;
    text-align: left;
}

.progress-text {
    font-size: 14px;
    color: #6dafe1;
    font-weight: bold;
    margin-bottom: 8px;
}

.question-text {
    font-size: 20px;
    color: #2c3e50;
    margin-bottom: 20px;
    line-height: 1.4;
}

/* Choices */
.options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
}

.option-btn {
    width: 100%;
    padding: 12px 18px;
    background-color: #ffffff;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-family: 'IBMPlex', sans-serif;
    font-size: 16px;
    color: #333333;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
}

.option-btn:hover {
    border-color: #6dafe1;
    background-color: #f4f9fd;
}

.option-btn.selected {
    border-color: #6dafe1;
    background-color: #6dafe1;
    color: #ffffff;
}

.nav-controls {
    display: flex;
    justify-content: space-between;
    width: 100%;
}

.footer {
    text-align: left;
    font-size: 13px;
    color: #7f8c8d;
    margin-top: auto;
    padding-top: 15px;
}

@media screen and (max-width: 600px) {
    body { padding: 12px; }
    .quiz-container { padding: 20px 15px; border-radius: 16px; }
    .title { font-size: 22px; }
    .question-text { font-size: 17px; }
    .option-btn { font-size: 14px; padding: 10px 14px; }
}
</style>
</head>

<div class="quiz-container">

        <a href="index.html" class="btn-capsule">หน้าแรก</a>
    </div>

    <div class="content">
        <div class="quiz-card">

            <div id="options" class="options-list">

            <div class="nav-controls">

                <button id="next-btn" class="btn-capsule" onclick="nextQuestion()">ข้อถัดไป</button>
            </div>
        </div>
    </div>
    
    <div class="footer">
        จัดทำโดย ด.ช. ภาณุพงษ์ รักบำรุง
    </div>
</div>

];

var currentIdx = 0;
var userAnswers = new Array(questions.length).fill(null);

function loadQuestion() {
    var qData = questions[currentIdx];
    document.getElementById("progress").innerHTML = "ข้อที่ " + (currentIdx + 1) + " / " + questions.length;
    document.getElementById("question").innerHTML = qData.q;
    
    var optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";
    
    for (var i = 0; i < qData.options.length; i++) {
        var btn = document.createElement("button");
        btn.className = "option-btn" + (userAnswers[currentIdx] === i ? " selected" : "");
        btn.innerHTML = String.fromCharCode(65 + i) + ". " + qData.options[i];
        btn.onclick = (function(index) {
            return function() { selectOption(index); };
        })(i);
        optionsDiv.appendChild(btn);
    }

    document.getElementById("prev-btn").style.visibility = (currentIdx === 0) ? "hidden" : "visible";
    document.getElementById("next-btn").innerHTML = (currentIdx === questions.length - 1) ? "ส่งแบบทดสอบ" : "ข้อถัดไป";
}

function selectOption(index) {
    userAnswers[currentIdx] = index;
    loadQuestion();
}

function prevQuestion() {
    if (currentIdx > 0) {
        currentIdx--;
        loadQuestion();
    }
}

function nextQuestion() {
    if (userAnswers[currentIdx] === null) {
        alert("กรุณาเลือกคำตอบก่อนไปข้อถัดไป");
        return;
    }
    
    if (currentIdx < questions.length - 1) {
        currentIdx++;
        loadQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    // Save state to sessionStorage for result.html
    sessionStorage.setItem("quizQuestions", JSON.stringify(questions));
    sessionStorage.setItem("quizUserAnswers", JSON.stringify(userAnswers));
    window.location.href = "result.html";
}

// Initial load
loadQuestion();
</script>

</body>
</html>
