<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>หน้าแรก | แบบทดสอบกล้องจุลทรรศน์</title>

<style type="text/css">
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    height: 100%;
}

body {
    background-image: url(assets/background.jpg);
    background-repeat: repeat;
    background-attachment: fixed;
    font-family: 'IBMPlex', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

@font-face {
    font-family: 'IBMPlex';
    src: url('fonts/IBM.ttf') format('truetype');
}

/* Responsive White Box Container */
.quiz-container {
    background-color: rgba(255, 255, 255, 0.92);
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    width: 100%;
    height: 100%;
    padding: 30px;
    text-align: center;
    display: flex;
    flex-direction: column;
    position: relative;
}

.content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* Centers title & buttons vertically */
}

.title {
    font-family: 'IBMPlex', sans-serif;
    color: #2c3e50;
    font-size: 28px;
    margin-bottom: 30px;
}

/* Button Group Layout */
.button-group {
    display: flex;
    flex-direction: column;
    gap: 16px; /* Spacing between top and bottom button */
    width: 100%;
    max-width: 320px; /* Controls maximum button width */
}

/* Capsule Outline Buttons */
.btn-capsule {
    display: block;
    width: 100%;
    padding: 14px 24px;
    background-color: #ffffff;
    color: #6dafe1;
    border: 2px solid #6dafe1;
    border-radius: 50px; /* Full rounded capsule shape */
    font-family: 'IBMPlex', sans-serif;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
}

.btn-capsule:hover {
    background-color: #6dafe1;
    color: #ffffff;
}

/* Footer Section */
.footer {
    text-align: left;
    font-size: 13px;
    color: #7f8c8d;
    margin-top: auto;
    padding-top: 15px;
}

/* Mobile Screen Adjustments */
@media screen and (max-width: 600px) {
    body {
        padding: 12px;
    }
    .quiz-container {
        padding: 20px 15px;
        border-radius: 16px;
    }
    .title {
        font-size: 22px;
        margin-bottom: 20px;
    }
    .button-group {
        max-width: 100%;
    }
    .btn-capsule {
        padding: 12px 20px;
        font-size: 16px;
    }
    .footer {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="quiz-container">
    <div class="content">
        <h1 class="title">แบบทดสอบกล้องจุลทรรศน์</h1>
        
        <div class="button-group">
            <a href="test.html" class="btn-capsule">เริ่มทำแบบทดสอบ</a>
            <a href="learn.html" class="btn-capsule">เรียนรู้</a>
        </div>
    </div>
    
    <div class="footer">
        จัดทำโดย ด.ช. ภาณุพงษ์ รักบำรุง
    </div>
</div>

</body>
</html>
